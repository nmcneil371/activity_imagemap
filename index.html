<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Creating An Image Map</title>
</head>
<body>
    <h1>Activity: Creating An Image Map</h1>
    <p>Name: Quan McNeil</p>
    <p>Date: September 5, 2026</p>
    <img src="media/ch03_image-to-map (1).jpg" alt="Image Map" usemap="#imagemap">

    <map name="imagemap">
    <area shape="rect"
          coords="700,295,900,345"
          href="https://www.google.com"
          alt="Website Search">
    <area shape="circle"
          coords="780,850,95"
          href="https://www.wordpress.org"
          alt="CMS">
    <area shape="poly"
          coords="270,260,390,255,475,320,450,390,300,390,250,330"
          href="https://www.google.com/drive/"
          alt="Cloud Storage">
</map>


</body>
</html>
